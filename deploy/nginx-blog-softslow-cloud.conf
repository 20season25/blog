# 「认知增量」博客 vhost —— 晨间恢复镜像用（未启用，等待 DNS）
#
# 使用步骤（晨间确认后执行，全程不影响 leancoach）：
#   1. 域名商处给 softslow.cloud 加 A 记录：  blog  →  118.25.188.243
#   2. 上传本文件： scp deploy/nginx-blog-softslow-cloud.conf root@118.25.188.243:/etc/nginx/conf.d/blog.conf
#   3. 先签证书（HTTP-01，走 leancoach.conf 里已有的 acme-challenge 路径）：
#        certbot certonly --webroot -w /var/www/letsencrypt -d blog.softslow.cloud
#   4. nginx -t && systemctl reload nginx
#   5. 验证： curl -sI https://blog.softslow.cloud/
#
# 注意：与 leancoach.conf 完全独立；reload 前必须 nginx -t。
# 同理，「编程之季」恢复上线时，可再复制一个 vhost（root /var/www/blog; server_name 随定）。

server {
    listen 80;
    listen [::]:80;
    server_name blog.softslow.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.softslow.cloud;

    ssl_certificate     /etc/letsencrypt/live/blog.softslow.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.softslow.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root  /var/www/blog/aiblog;   # 镜像目录，与 GitHub Pages 内容一致
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
