<h1 class="title">冬冬的镜头</h1>
<p class="lede">我的朋友冬冬是一位摄影师。这是他镜头下的深圳——海、雨、山里的雾，和那些刚好被撞见的瞬间。</p>
<div class="credit">
<b>关于摄影师</b>　冬冬，摄影师。<br>
这里是一个小小的展墙，如果某张照片让你停了一下，欢迎告诉我也告诉他。

<figure data-title="赶海的傍晚" data-desc="深圳的海，礁石滩的水洼里藏着夏天的秘密，和朋友一起找小螃蟹的快乐"><img src="1.jpg" alt="赶海的傍晚"><figcaption>赶海的傍晚 · 深圳·海边礁石滩</figcaption></figure><figure data-title="雨夜街景" data-desc="突然的暴雨，电动车溅起的水花和车灯的反光，是城市夜晚的动态瞬间"><img src="2.jpg" alt="雨夜街景"><figcaption>雨夜街景 · 深圳·街头雨夜</figcaption></figure><figure data-title="蓝调时刻" data-desc="傍晚的城市，写字楼的灯光刚亮起，路灯也加入了这场温柔的仪式"><img src="3.jpg" alt="蓝调时刻"><figcaption>蓝调时刻 · 深圳·城市写字楼旁</figcaption></figure><figure data-title="夜行者" data-desc="过马路的小狗，在车灯的逆光里，像一个奔赴夜晚的小英雄"><img src="4.jpg" alt="夜行者"><figcaption>夜行者 · 深圳·夜晚路口</figcaption></figure><figure data-title="宿舍的夏天" data-desc="阳光穿过桉树叶，落在远处的宿舍楼，是被绿意包裹的日常"><img src="5.jpg" alt="宿舍的夏天"><figcaption>宿舍的夏天 · 深圳·校园宿舍区</figcaption></figure><figure data-title="送花的人" data-desc="街头遇到的浪漫，电动车上抱着花束的人，带着满手的温柔奔赴某处"><img src="6.jpg" alt="送花的人"><figcaption>送花的人 · 深圳·城市街头</figcaption></figure><figure data-title="公园的小松鼠" data-desc="恩上湿地公园的草坪，小松鼠一闪而过，只留下一抹灵动的影子"><img src="7.jpg" alt="公园的小松鼠"><figcaption>公园的小松鼠 · 深圳·梧桐山恩上湿地公园</figcaption></figure><figure data-title="暴雨街头" data-desc="突如其来的大雨，行人抱着东西在雨里快走，鞋子踩出细碎的水花"><img src="8.jpg" alt="暴雨街头"><figcaption>暴雨街头 · 深圳·雨天路口</figcaption></figure><figure data-title="工业展览馆" data-desc="深圳市工业展览馆的台阶，黄衣女生和黑衣男士的背影，在建筑前构成了一幅画"><img src="9.jpg" alt="工业展览馆" loading="lazy"><figcaption>工业展览馆 · 深圳·工业展览馆</figcaption></figure><figure data-title="雨里下车" data-desc="粉色小车里的人，撑着临时的伞，在暴雨里匆匆下车，狼狈又真实的瞬间"><img src="10.jpg" alt="雨里下车" loading="lazy"><figcaption>雨里下车 · 深圳·雨天街头</figcaption></figure><figure data-title="下雨有彩虹" data-desc="恩上湿地公园，在梧桐山上，以前和文婷去过一次"><img src="11.jpg" alt="下雨有彩虹" loading="lazy"><figcaption>下雨有彩虹 · 深圳梧桐山恩上湿地公园</figcaption></figure><figure data-title="难忘回忆" data-desc="这次是晴天"><img src="12.jpg" alt="难忘回忆" loading="lazy"><figcaption>难忘回忆 · 深圳梧桐山恩上湿地公园</figcaption></figure><figure data-title="雨里野餐" data-desc="草坪上独自撑伞的人，野餐垫和捞鱼网还在，雨天也没被打断的松弛"><img src="13.jpg" alt="雨里野餐" loading="lazy"><figcaption>雨里野餐 · 深圳梧桐山恩上湿地公园</figcaption></figure><figure data-title="山边剪影" data-desc="云雾里的梧桐山，栈道上走过的一家人，背影和山景融成了温柔的画面"><img src="14.jpg" alt="山边剪影" loading="lazy"><figcaption>山边剪影 · 深圳梧桐山恩上湿地公园</figcaption></figure><figure data-title="和鹅群的雨天" data-desc="撑着蓝伞的小女孩，蹲在草坪上和散步的鹅群互动，雨天也藏不住的可爱"><img src="15.jpg" alt="和鹅群的雨天" loading="lazy"><figcaption>和鹅群的雨天 · 深圳梧桐山恩上湿地公园</figcaption></figure><figure data-title="雨中山景" data-desc="暴雨里的恩上全景，远山被雨雾裹住，草地和步道在雨里晕成了水彩画"><img src="16.jpg" alt="雨中山景" loading="lazy"><figcaption>雨中山景 · 深圳梧桐山恩上湿地公园</figcaption></figure><figure data-title="雨中小径" data-desc="恩上湿地公园的暴雨天，木栈道上撑伞的人，把绿色的草地衬得格外温柔"><img src="17.jpg" alt="雨中小径" loading="lazy"><figcaption>雨中小径 · 深圳梧桐山恩上湿地公园</figcaption></figure><figure data-title="礁石滩的午后" data-desc="晴天的海边，沙滩上的大礁石和歇脚的人，是深圳的松弛感时刻"><img src="18.jpg" alt="礁石滩的午后" loading="lazy"><figcaption>礁石滩的午后 · 深圳·西涌沙滩礁石滩</figcaption></figure>

<script>
var imgs=[].slice.call(document.querySelectorAll('.gallery figure'));
var lb=document.getElementById('lb'), lbImg=lb.querySelector('img'),
    capT=lb.querySelector('.cap .t'), capD=lb.querySelector('.cap .d'), cur=0;
function show(i){cur=(i+imgs.length)%imgs.length;var f=imgs[cur],im=f.querySelector('img');
  lbImg.src=im.getAttribute('src');lbImg.alt=im.alt;
  capT.textContent=f.dataset.title||'';capD.textContent=f.dataset.desc||'';lb.classList.add('on');}
imgs.forEach(function(f,i){f.addEventListener('click',function(){show(i);});});
lb.querySelector('.x').addEventListener('click',function(){lb.classList.remove('on');});
lb.querySelector('.prev').addEventListener('click',function(e){e.stopPropagation();show(cur-1);});
lb.querySelector('.next').addEventListener('click',function(e){e.stopPropagation();show(cur+1);});
lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('on');});
document.addEventListener('keydown',function(e){
  if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')lb.classList.remove('on');
  if(e.key==='ArrowLeft')show(cur-1);
  if(e.key==='ArrowRight')show(cur+1);});
</script>
